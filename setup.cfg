[bumpversion]
current_version = 0.1.0
commit = True
tag = True

# Version is single-sourced from the package __init__; pyproject.toml
# reads it dynamically (tool.setuptools.dynamic). Bumping here propagates
# everywhere.
[bumpversion:file:src/elphy/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

