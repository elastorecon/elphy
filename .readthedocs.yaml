# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# docs/conf.py imports elphy (for the version and autodoc), so install the
# package with its runtime dependencies plus the docs extra.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
